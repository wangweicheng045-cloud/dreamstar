name: Build DreamStar 0.5.1 Crashfixed

on:
  push:
    branches: [ "build-0.5.1-whale-time-fix-crashfixed" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact source
        run: |
          cat ci/0.5.1-crashfixed/source.part-* > /tmp/dreamstar-source.zip
          echo "ad55d95ecc98da019f1d78d0354be4466d5349ec4f5a5071a3fc2e66b37516f9  /tmp/dreamstar-source.zip" | sha256sum -c -
          rm -rf /tmp/dreamstar-src
          mkdir -p /tmp/dreamstar-src
          unzip -q /tmp/dreamstar-source.zip -d /tmp/dreamstar-src
          PROJECT_DIR="$(dirname "$(find /tmp/dreamstar-src -maxdepth 3 -name build.gradle -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Forge mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean build -x test --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-1.20.1-0.5.1-whale-time-fix-crashfixed
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
