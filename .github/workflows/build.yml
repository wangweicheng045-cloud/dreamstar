name: Build DreamStar 0.5.1 Whale Time Audio Particles

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Reconstruct and patch source
        run: |
          cat ci/dreamstar-0.5.1-source.b64.* | tr -d '\n\r' | base64 --decode > /tmp/dreamstar-source.zip
          rm -rf /tmp/dreamstar-source && mkdir -p /tmp/dreamstar-source
          unzip -q /tmp/dreamstar-source.zip -d /tmp/dreamstar-source
          sed -i 's/io.redspace.ironsspellbooks.api.magic.MagicManager/io.redspace.ironsspellbooks.capabilities.magic.MagicManager/' /tmp/dreamstar-source/src/main/java/dev/dreamstar/time/TimeLockEvents.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/dreamstar-source/src/main/java/dev/dreamstar/time/TimeDomainCombo.java')
          s=p.read_text()
          s=s.replace('private long fractureAt=-1,releaseAt=-1;', 'private long fractureAt=-1,releaseAt=-1,targetReadyAt=-1;')
          s=s.replace('        if(n.contains("whaleTargetAt")&&whale.level().getGameTime()<n.getLong("whaleTargetAt"))return false;\n','')
          s=s.replace('fractureAt=releaseAt=-1;fracturePos=null;', 'fractureAt=releaseAt=targetReadyAt=-1;fracturePos=null;')
          s=s.replace('targetId=target.getUUID();target.getPersistentData().getCompound(TimeLockState.KEY).putUUID("whaleClaim",whale.getUUID());', 'targetId=target.getUUID();targetReadyAt=world.getGameTime()+40;target.getPersistentData().getCompound(TimeLockState.KEY).putUUID("whaleClaim",whale.getUUID());')
          s=s.replace('        if(!jumping){\n            ground=surface(world,target.position());', '        if(!jumping){\n            if(targetReadyAt>=0&&world.getGameTime()<targetReadyAt)return null;\n            targetReadyAt=-1;\n            ground=surface(world,target.position());')
          p.write_text(s)
          PY
      - name: Build Forge mod
        working-directory: /tmp/dreamstar-source
        run: gradle clean build --no-daemon --stacktrace
      - name: Publish patched combo class
        run: |
          base64 -w 0 /tmp/dreamstar-source/build/classes/java/main/dev/dreamstar/time/TimeDomainCombo.class > ci/output-TimeDomainCombo.b64
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci/output-TimeDomainCombo.b64
          git commit -m "CI output whale delay class [skip ci]"
          git push
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-1.20.1-0.5.1-whale-delay-fix
          path: /tmp/dreamstar-source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
