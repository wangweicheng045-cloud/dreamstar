name: Build DreamStar 0.3.1 Cinematic

on:
  push:
    branches: [ "cinematic-0.3.1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Reconstruct cinematic source
        run: |
          cat ci/cinematic/chunk*.b64 | base64 --decode > /tmp/dreamstar-cinematic.zip
          mkdir -p /tmp/dreamstar-cinematic
          unzip -q /tmp/dreamstar-cinematic.zip -d /tmp/dreamstar-cinematic
          test -f /tmp/dreamstar-cinematic/build.gradle
          test -f /tmp/dreamstar-cinematic/src/main/resources/assets/dreamstar/sounds/domain_cast.ogg
          test -f /tmp/dreamstar-cinematic/src/main/resources/assets/dreamstar/sounds/domain_end.ogg
          cp ci/cinematic/DreamStarCinematicController.java /tmp/dreamstar-cinematic/src/main/java/dev/dreamstar/client/DreamStarCinematicController.java
          cp ci/cinematic/DreamStarSpell.java /tmp/dreamstar-cinematic/src/main/java/dev/dreamstar/spell/DreamStarSpell.java

      - name: Build Forge mod
        working-directory: /tmp/dreamstar-cinematic
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-1.20.1-0.3.1-cinematic-v2
          path: /tmp/dreamstar-cinematic/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
