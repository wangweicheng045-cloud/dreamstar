name: Build DreamStar 0.3.1 Active Lock

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Reconstruct 0.3.1 source
        run: |
          cat ci/dreamstar-0.3.1.part* | base64 --decode > /tmp/dreamstar-source.zip
          mkdir -p /tmp/dreamstar-source
          unzip -q /tmp/dreamstar-source.zip -d /tmp/dreamstar-source
          test -f /tmp/dreamstar-source/dreamstar-whale/build.gradle

      - name: Build Forge mod
        working-directory: /tmp/dreamstar-source/dreamstar-whale
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-1.20.1-0.3.1-active-domain-lock
          path: /tmp/dreamstar-source/dreamstar-whale/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
