name: Build Dreamstar JAR

on:
  push:
    branches: [ "lock-strike-0.5.29" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Reconstruct source and delta
        run: |
          cat ci/dreamstar-0.5.1-source.b64.* | tr -d '\n\r' | base64 --decode > /tmp/src.zip
          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          cat .github/source_parts/delta.b64.* | tr -d '\n\r' | base64 --decode > /tmp/delta.zip
          unzip -qo /tmp/delta.zip -d /tmp/src
          echo '--- CANNON FILES ---'
          find /tmp/src/src/main/java/dev/dreamstar -type f | grep -E '/(cannon|point|thunder|thousand)/' | sort || true
          echo '--- CANNON RESOURCES ---'
          find /tmp/src/src/main/resources/assets/dreamstar -type f | grep -E 'cannon|point|thunder|thousand' | sort | head -200 || true
      - name: Build final reobfuscated jar
        working-directory: /tmp/src
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-lock-strike-base-check
          path: /tmp/src/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
