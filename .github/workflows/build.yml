name: Build scoped time-lock audio particles patch

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Reconstruct source and apply only scoped time patch
        run: |
          cat ci/dreamstar-0.5.1-source.b64.* | tr -d '\n\r' | base64 --decode > /tmp/src.zip
          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          cp ci/patch/TimeDomainCombo.java /tmp/src/src/main/java/dev/dreamstar/time/TimeDomainCombo.java
          cp ci/patch/TimeLockState.java /tmp/src/src/main/java/dev/dreamstar/time/TimeLockState.java
          cp ci/patch/TimeLockEvents.java /tmp/src/src/main/java/dev/dreamstar/time/TimeLockEvents.java
          cp ci/patch/TimeRegistry.java /tmp/src/src/main/java/dev/dreamstar/time/TimeRegistry.java
          cp ci/patch/TimeVisuals.java /tmp/src/src/main/java/dev/dreamstar/time/client/TimeVisuals.java
      - name: Build final reobfuscated jar
        working-directory: /tmp/src
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload reobfuscated jar
        uses: actions/upload-artifact@v4
        with:
          name: scoped-time-lock-audio-particles-build
          path: /tmp/src/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
