name: Build scoped domain time-lock fix
on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Reconstruct and patch only TimeDomainCombo
        run: |
          cat ci/dreamstar-0.5.1-source.b64.* | tr -d '\n\r' | base64 --decode > /tmp/src.zip
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          sed -i 's/io.redspace.ironsspellbooks.api.magic.MagicManager/io.redspace.ironsspellbooks.capabilities.magic.MagicManager/' /tmp/src/src/main/java/dev/dreamstar/time/TimeLockEvents.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/src/main/java/dev/dreamstar/time/TimeDomainCombo.java')
          s=p.read_text()

          # Preserve the already-approved whale direction fix.
          old='var desired=travelled<=route.length()?new Vec3(point.x,point.y,point.z):domain.position().add(0,-5,0);'
          new='var desired=new Vec3(point.x,point.y,point.z);'
          if old in s:
              s=s.replace(old,new)

          old='if(travelled>route.length()&&goal.distanceToSqr(domain.position())<Math.pow(Math.max(2,domain.radius()-11),2)){reset(whale);return null;}'
          new='if(travelled>route.length()+BreachRoute.SPEED){reset(whale);return null;}'
          if old in s:
              s=s.replace(old,new)

          # Domain-only time-lock settlement: release exactly when the fracture visual is actually spawned.
          old='if(fractureAt>=0&&world.getGameTime()>=fractureAt&&fractureId==null)spawnFracture(world,domain,whale);'
          new='''if(fractureAt>=0&&world.getGameTime()>=fractureAt&&fractureId==null){
              spawnFracture(world,domain,whale);
              if(fractureId!=null&&target!=null&&eligible(whale,domain,target))TimeLockState.release(target,3);
          }'''
          if old not in s:
              raise SystemExit('fracture spawn anchor not found')
          s=s.replace(old,new)

          old='''        if(releaseAt<0&&struck&&goal.y>whale.getY()&&travelled<route.descentStart()
                  &&target!=null&&eligible(whale,domain,target)&&headTouches(target,whale.position(),goal))releaseAt=world.getGameTime()+20;
          if(releaseAt>=0&&world.getGameTime()>=releaseAt){
              if(target!=null&&eligible(whale,domain,target))TimeLockState.release(target,3);
              releaseAt=-1;
          }
'''
          if old not in s:
              raise SystemExit('old release block not found')
          s=s.replace(old,'')

          p.write_text(s)
          PY
      - name: Build final reobfuscated jar
        working-directory: /tmp/src
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload reobfuscated build
        uses: actions/upload-artifact@v4
        with:
          name: scoped-domain-time-lock-build
          path: /tmp/src/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
