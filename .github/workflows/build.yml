name: Build whale direction patch
on:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Reconstruct source
        run: |
          cat ci/dreamstar-0.5.1-source.b64.* | tr -d '\n\r' | base64 --decode > /tmp/src.zip
          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          sed -i 's/io.redspace.ironsspellbooks.api.magic.MagicManager/io.redspace.ironsspellbooks.capabilities.magic.MagicManager/' /tmp/src/src/main/java/dev/dreamstar/time/TimeLockEvents.java
          sed -i 's/var desired=travelled<=route.length()?new Vec3(point.x,point.y,point.z):domain.position().add(0,-5,0);/var desired=new Vec3(point.x,point.y,point.z);/' /tmp/src/src/main/java/dev/dreamstar/time/TimeDomainCombo.java
          sed -i 's/if(travelled>route.length()&&goal.distanceToSqr(domain.position())<Math.pow(Math.max(2,domain.radius()-11),2)){reset(whale);return null;}/if(travelled>route.length()+BreachRoute.SPEED){reset(whale);return null;}/' /tmp/src/src/main/java/dev/dreamstar/time/TimeDomainCombo.java
      - name: Compile
        working-directory: /tmp/src
        run: gradle clean compileJava --no-daemon --stacktrace
      - name: Publish only whale direction class
        run: |
          base64 -w 0 /tmp/src/build/classes/java/main/dev/dreamstar/time/TimeDomainCombo.class > ci/output-TimeDomainCombo-direction.b64
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci/output-TimeDomainCombo-direction.b64
          git commit -m "CI output whale direction class [skip ci]"
          git push

      - name: Upload whale direction class
        uses: actions/upload-artifact@v4
        with:
          name: whale-direction-class
          path: /tmp/src/build/classes/java/main/dev/dreamstar/time/TimeDomainCombo.class
          if-no-files-found: error
