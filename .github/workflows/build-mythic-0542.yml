name: Build Dreamstar 0.5.42 JAR

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "GitHub Release containing the complete source ZIP"
        type: string
        default: "source-0.5.42"
        required: true
      source_asset:
        description: "Source ZIP asset filename"
        type: string
        default: "dreamstar-0.5.42-mythic-ink-approved-texture-source.zip"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  forge-build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'source-0.5.42'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-disabled: true

      - name: Download complete 0.5.42 source ZIP from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_tag }}
          SOURCE_ASSET: ${{ github.event_name == 'release' && 'dreamstar-0.5.42-mythic-ink-approved-texture-source.zip' || inputs.source_asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-download" "$RUNNER_TEMP/dreamstar-build"
          gh release download "$SOURCE_TAG" --pattern "$SOURCE_ASSET" --dir "$RUNNER_TEMP/source-download"
          unzip -q "$RUNNER_TEMP/source-download/$SOURCE_ASSET" -d "$RUNNER_TEMP/dreamstar-build"
          project="$RUNNER_TEMP/dreamstar-build/dreamstar-0.5.42-mythic-ink"
          test -f "$project/build.gradle"
          test -f "$project/gradlew"
          test -f "$project/src/main/resources/assets/dreamstar/textures/item/mythic_ink.png"
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo "Using exact 0.5.42 source ZIP and approved mythic ink texture"

      - name: Compile and reobfuscate Forge mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Verify JAR before publishing
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -1)"
          test -n "$jar_file"
          unzip -t "$jar_file" | tail -1
          unzip -l "$jar_file" | grep -F 'assets/dreamstar/textures/item/mythic_ink.png'
          sha256sum "$jar_file"
          echo "JAR_PATH=$jar_file" >> "$GITHUB_ENV"

      - name: Upload tested JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamstar-0.5.42-mythic-ink-forge-1.20.1
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach JAR to the source GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_tag }}
        run: gh release upload "$SOURCE_TAG" "$JAR_PATH" --clobber
